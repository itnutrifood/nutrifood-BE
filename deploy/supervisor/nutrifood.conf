[program:nutrifood]
directory=__PROJECT_PATH__
command=__VENV_PATH__/bin/uvicorn backend.config.asgi:app --host 127.0.0.1 --port 8000 --workers 2 --proxy-headers --forwarded-allow-ips=127.0.0.1
user=__APP_USER__
autostart=true
autorestart=true
startsecs=5
startretries=5
stopsignal=TERM
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/nutrifood.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
environment=PYTHONUNBUFFERED="1",PYTHONDONTWRITEBYTECODE="1",LOG_COMPONENT="api"
