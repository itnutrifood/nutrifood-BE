services:
  api:
    image: nutrifood-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      LOG_COMPONENT: api
      LOG_DIRECTORY: /var/log/nutrifood
    command: uvicorn backend.config.asgi:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8008:8000"
    volumes:
      - .:/app
      - application-logs:/var/log/nutrifood
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  celery-worker:
    image: nutrifood-backend
    env_file:
      - .env
    environment:
      LOG_COMPONENT: celery-worker
      LOG_DIRECTORY: /var/log/nutrifood
    command:
      - celery
      - -A
      - backend.config.celery_app:app
      - worker
      - --loglevel=INFO
      - --queues=default,periodic
    volumes:
      - .:/app
      - application-logs:/var/log/nutrifood
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    image: nutrifood-backend
    env_file:
      - .env
    environment:
      LOG_COMPONENT: celery-beat
      LOG_DIRECTORY: /var/log/nutrifood
    command:
      - celery
      - -A
      - backend.config.celery_app:app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/celerybeat-schedule
    volumes:
      - .:/app
      - celery-beat-data:/var/lib/celery
      - application-logs:/var/log/nutrifood
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  celery-beat-data:
  application-logs:
