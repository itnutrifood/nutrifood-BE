services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    command: uvicorn backend.config.asgi:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8008:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.migrations
    env_file:
      - .env
    volumes:
      - ./migrations:/migrations
    command: up
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:17
    env_file:
      - .env
    ports:
      - "5439:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
