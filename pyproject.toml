[tool.poetry]
name = "nutrifood"
version = "0.1.0"
description = "NutriFood backend API"
authors = ["NutriFood Team <dev@nutrifood.local>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.13"
fastapi = { extras = ["standard"], version = "==0.139.0" }
asyncpg = "==0.31.0"
pydantic-settings = "==2.14.2"
python-dotenv = "==1.2.2"
pyjwt = { extras = ["crypto"], version = "==2.13.0" }
firebase-admin = "==7.5.0"
boto3 = "1.43.4"
pillow = "12.3.0"
celery = {version = "5.6.3", extras = ["redis"]}
concurrent-log-handler = "==0.9.29"

[tool.poetry.group.dev.dependencies]
httpx = "==0.28.1"
mypy = "==2.1.0"
pytest = "==9.1.1"
pytest-asyncio = "==1.4.0"
ruff = "==0.15.20"

[build-system]
requires = ["poetry-core==2.4.1"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.13"
plugins = []
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["backend"]

[[tool.mypy.overrides]]
module = [
    "asyncpg",
    "boto3",
    "botocore",
    "botocore.*",
    "celery",
    "celery.*",
    "firebase_admin",
    "firebase_admin.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
