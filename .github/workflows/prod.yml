name: Deploy Backend to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nutrifood-backend-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: prod

    env:
      DEPLOY_HOST: ${{ secrets.HOST }}
      DEPLOY_USERNAME: ${{ secrets.USERNAME }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      DEPLOY_PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
      DEPLOY_REPO_SSH_KEY_PATH: ${{ secrets.REPO_SSH_KEY_PATH }}
      DEPLOY_VENV_PATH: ${{ secrets.VENV_PATH }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/nutrifood-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" | tr -d '\r' \
            > "$RUNNER_TEMP/nutrifood-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" \
            > "$RUNNER_TEMP/nutrifood-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/nutrifood-ssh/id_ed25519"
          chmod 0644 "$RUNNER_TEMP/nutrifood-ssh/known_hosts"

      - name: Pull, install, migrate, and restart
        shell: bash
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$RUNNER_TEMP/nutrifood-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/nutrifood-ssh/known_hosts" \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USERNAME@$DEPLOY_HOST" \
            bash -s -- \
              "$DEPLOY_PROJECT_PATH" \
              "$DEPLOY_REPO_SSH_KEY_PATH" \
              "${DEPLOY_VENV_PATH:-__AUTO__}" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail

          project_path=$1
          repo_ssh_key_path=$2
          venv_path=$3

          if [ "$venv_path" = "__AUTO__" ]; then
            venv_path="$(dirname "$project_path")/venv"
          fi

          cd "$project_path"
          export GIT_SSH_COMMAND="ssh -i $repo_ssh_key_path -o BatchMode=yes -o IdentitiesOnly=yes"

          git fetch origin main
          git checkout main || git checkout --track -b main origin/main
          git pull --ff-only origin main

          poetry_bin="$project_path/.poetry-venv/bin/poetry"
          if [ ! -x "$poetry_bin" ]; then
            python3 -m venv "$project_path/.poetry-venv"
            "$project_path/.poetry-venv/bin/python" -m pip install \
              --disable-pip-version-check \
              "poetry==2.3.4"
          fi

          if [ ! -x "$venv_path/bin/python" ]; then
            printf 'Application virtual environment not found: %s\n' "$venv_path" >&2
            exit 1
          fi

          VIRTUAL_ENV="$venv_path" \
            PATH="$venv_path/bin:$PATH" \
            POETRY_VIRTUALENVS_CREATE=false \
            "$poetry_bin" install --only main --no-root --no-interaction --no-ansi
          "$venv_path/bin/python" -c 'import fastapi, firebase_admin, uvicorn'

          set -a
          . ./.env
          set +a
          /usr/local/bin/goose -dir migrations up

          supervisorctl restart nutrifood
          supervisorctl status nutrifood
          REMOTE_SCRIPT
